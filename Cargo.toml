[package]
name = "lit_agent"
version = "0.1.0"
edition = "2024"

[dependencies]
rig = { version = "0.42.0", features = ["reqwest-middleware"] }
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
serde= { version = "1", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "time"] }
pubmed-client ="0.4.0"
serde_json = "1"
anyhow = { version = "1.0", default-features = false }
reqwest = "0.13"
pdf-extract = "0.12"